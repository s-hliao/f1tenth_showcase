# bv3 on the car (old setup: f1tenth_ws + particle filter).
#   python3 bv3_node.py --ros-args --params-file bv3_car.yaml
# Write every number with a decimal point where the default has one (ROS 2 rejects 1 for a float).
bv3:
  ros__parameters:

    # ---- [0] TRACK: the only place a map or raceline is named. Change tracks here, never in the node. ----
    # Raceline = ROOT/NAME/RACELINE. MAP = ROOT/NAME/MAP. Any entry that starts with / or ~ is used as-is.
    # MAP is only a sanity check (raceline inside the map?). The particle filter's map is set in ITS launch.
    track:
      ROOT: "~/f1tenth_showcase/src/frenet_baseline/waypoints"
      NAME: "venue_ccw"                  # venue_ccw | venue_cw | venue_ccw_ay59 | venue_cw_ay59
      RACELINE: "raceline_stable.csv"    # raceline_stable | raceline_fast | raceline_optimal | centerline
      MAP: "~/f1tenth_showcase/src/frenet_baseline/maps/racetrack_map.yaml"

    pose_topic: "/pf/pose/odom"
    odom_topic: ""                       # '' = speed from the pose message
    scan_topic: "/scan"
    WARMUP_CYCLES: 10
    TELEMETRY_ENABLE: true
    VIZ_ENABLE: false

    scan:                                # [1] off: nothing uses the scan yet
      ENABLE: false
      PUBLISH: false
      RANGE_MIN: 0.30
      RANGE_MAX: 10.0
      STRIDE: 1

    pose:                                # [2]
      POSE_TO_REAR_AXLE_M: 0.0           # 0 = track the laser point (LQR REF_X accounts for it)
      MAX_WALK_SEGS: 50
      RELOC_DIST_M: 1.5

    planner:                             # [4]
      FF_PREVIEW_T: 0.12
      FF_PREVIEW_MIN: 0.3
      SPEED_PREVIEW_T: 0.10
      SPEED_SCALE: 1.0
      SPEED_MAX: 3.0                     # start at 3.0 with LQR; ladder 3.0 -> 4.0 -> 4.8
      SPEED_MIN: 1.0

    optimizer:                           # [5] shared by every controller
      TYPE: "LQR"                        # LQR | PURE_PURSUIT | PD
      WHEELBASE: 0.325
      K_US: 0.0215                       # car value (bv1)
      STEER_LIMIT: 0.40
      STEER_STEP_MAX: 0.18               # rad per pose cycle, same as bv1 / bv2
      BRAKE_ENABLE: true
      BRAKE_THRESHOLD: 0.5
      BRAKE_CURRENT_MIN: 3000.0
      BRAKE_CURRENT_MAX: 8000.0

    lqr:
      Q_D: 1.0                           # lateral error weight
      Q_PSI: 0.1                         # heading error weight
      R_STEER: 3.0                       # steering weight (bigger = softer)
      REF_X: 0.26                        # pose point (laser) ahead of the rear axle [m]
      DT: 0.025                          # 40 Hz pose
      DELAY_S: 0.125                     # pose age + servo lag; set to the measured latency
      V_MIN: 0.5
      V_MAX: 10.0
      V_STEP: 0.05

    pure_pursuit:                        # bv2 race setting (A/B reference)
      LA_TIME: 0.25
      LA_MIN: 0.8
      LA_MAX: 2.5
      REACT_V0: 2.2
      REACT_EXP: 2.0
      REACT_MIN: 0.2

    pd:                                  # bv2 Frenet PD as run with BaS
      KP: 0.45
      KD: 0.55
      V_REF: 3.0
      V_MIN_SCHED: 1.0