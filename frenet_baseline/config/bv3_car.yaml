# bv3 on the car (old setup: f1tenth_ws + particle filter).
#   python3 bv3_node.py --ros-args --params-file bv3_car.yaml
# Write every number with a decimal point where the default has one (ROS 2 rejects 1 for a float).
bv3:
  ros__parameters:

    # ---- [0] TRACK: the only place a map or raceline is named. Change tracks here, never in the node. ----
    # Raceline = ROOT/NAME/RACELINE. MAP = ROOT/NAME/MAP. Any entry that starts with / or ~ is used as-is.
    # MAP is only a sanity check (raceline inside the map?). The particle filter's map is set in ITS launch.
    track:
      ROOT: "~/f1tenth_showcase/src/frenet_baseline/waypoints"
      NAME: "venue_ccw"                  # venue_ccw | venue_cw | venue_ccw_ay59 | venue_cw_ay59
      RACELINE: "raceline_stable.csv"    # raceline_stable | raceline_fast | raceline_optimal | centerline
      MAP: "~/f1tenth_showcase/src/frenet_baseline/maps/racetrack_map.yaml"

    pose_topic: "/pf/pose/odom"
    odom_topic: ""                       # '' = speed from the pose message
    scan_topic: "/scan"
    WARMUP_CYCLES: 10
    TELEMETRY_ENABLE: true
    VIZ_ENABLE: false

    scan:                                # [1] off: nothing uses the scan yet
      ENABLE: false
      PUBLISH: false
      RANGE_MIN: 0.30
      RANGE_MAX: 10.0
      STRIDE: 1

    avoid:                               # [3] barrier-state (BaS) obstacle avoidance
      ENABLE: false                      # false = bv3 exactly as without avoidance (scan not used)
      CAR_HALF_WIDTH: 0.15
      CAR_FRONT: 0.414                   # pose point -> front bumper (+ steering-delay margin) [m]
      CAR_REAR: 0.40
      BAS_MARGIN: 0.15                   # clearance [m]; 0.10 in the car BaS demo, 0.15 halved sim crashes in narrow corners
      H_ACT_OBS: 4.0                     # barrier switches on below this ellipse level (~4 m out)
      T_LOOK: 0.45                       # obstacle ellipse stretched ahead by T_LOOK * v [s]
      K_B_OBS: 3.0                       # how hard d_ref is pushed
      K_DB_OBS: 0.10
      K_RELAX: 1.5                       # return to the line [1/s]
      DREF_RATE_MAX: 3.0                 # [m/s]
      PSI_REF_TAU: 0.10                  # smoothing of the shifted path's heading [s]
      PSI_REF_MAX: 0.30                  # [rad]
      K_BV: 0.8                          # slow-down while avoiding
      K_BV_RETURN: 0.3
      V_BAS_MIN: 1.5                     # lowest speed while avoiding [m/s]
      LASER_X: 0.0                       # laser ahead of the pose point [m] (car: pose IS the laser)
      RANGE_MIN: 0.30                    # ignores the car's own returns
      OBS_RANGE: 6.0                     # detection range [m]
      OBS_PERSIST: 2                     # scans in a row to trust an obstacle
      OBS_CLEAR: 4                       # empty scans to drop it
      OBS_BIRTH_RANGE: 1.5               # new obstacles must first be seen farther than this [m]
      OBS_EDGE_JUMP: 0.3                 # obstacle must stand out from its background [m]
      OBS_EDGE_SIDES: 2                  # 1 if obstacles may touch a wall (wall-hugging racelines)

    pose:                                # [2]
      POSE_TO_REAR_AXLE_M: 0.0           # 0 = track the laser point (LQR REF_X accounts for it)
      MAX_WALK_SEGS: 50
      RELOC_DIST_M: 1.5

    planner:                             # [4]
      FF_PREVIEW_T: 0.12
      FF_PREVIEW_MIN: 0.3
      SPEED_PREVIEW_T: 0.10
      SPEED_SCALE: 1.0
      SPEED_MAX: 3.0                     # start at 3.0 with LQR; ladder 3.0 -> 4.0 -> 4.8
      SPEED_MIN: 1.0

    optimizer:                           # [5] shared by every controller
      TYPE: "LQR"                        # LQR | PURE_PURSUIT | PD
      WHEELBASE: 0.325
      K_US: 0.0215                       # car value (bv1)
      STEER_LIMIT: 0.40
      STEER_STEP_MAX: 0.18               # rad per pose cycle, same as bv1 / bv2
      BRAKE_ENABLE: true
      BRAKE_THRESHOLD: 0.5
      BRAKE_CURRENT_MIN: 3000.0
      BRAKE_CURRENT_MAX: 8000.0

    lqr:
      Q_D: 1.0                           # lateral error weight
      Q_PSI: 0.1                         # heading error weight
      R_STEER: 3.0                       # steering weight (bigger = softer)
      REF_X: 0.26                        # pose point (laser) ahead of the rear axle [m]
      DT: 0.025                          # 40 Hz pose
      DELAY_S: 0.125                     # pose age + servo lag; set to the measured latency
      V_MIN: 0.5
      V_MAX: 10.0
      V_STEP: 0.05

    pure_pursuit:                        # bv2 race setting (A/B reference)
      LA_TIME: 0.25
      LA_MIN: 0.8
      LA_MAX: 2.5
      REACT_V0: 2.2
      REACT_EXP: 2.0
      REACT_MIN: 0.2

    pd:                                  # bv2 Frenet PD as run with BaS
      KP: 0.45
      KD: 0.55
      V_REF: 3.0
      V_MIN_SCHED: 1.0